<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img" aria-labelledby="title desc">
  <title id="title">Dinesh Kumar - Professional Journey</title>
  <desc id="desc">A verified-status interface showing five employers, locations, and employment periods.</desc>

  <defs>
